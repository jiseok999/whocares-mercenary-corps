name: Android Build

# 트리거:
#  - main / develop 브랜치로 push (직접 push 또는 PR merge)
#  - main을 대상으로 하는 PR (빌드가 깨지는지 머지 전에 확인)
#  - workflow_dispatch (필요할 때 수동 실행)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-balance-data:
    name: Validate balance CSVs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # zombies.csv / rounds.csv 데이터 무결성 검사.
      # 여기서 실패하면 Unity 빌드는 아예 시작하지 않는다 (빌드 시간 낭비 방지 +
      # "빌드는 됐는데 게임에서 적이 안 나온다" 류의 데이터 문제를 커밋 단계에서 차단).
      #
      # TEMP(2026-08-20): 현재 rounds.csv에 이미 존재하는 데이터 버그 2건
      # (round10의 미정의 UID 'boss1', round20의 헤더 초과 Spawn 그룹 'ooze_boss')은
      # 게임 밸런스 수정이라 디자인 판단이 필요해 즉시 고치지 않기로 함.
      # 그 사이에도 빌드/릴리즈 파이프라인 자체는 계속 검증할 수 있도록
      # 이 스텝만 continue-on-error로 임시 완화. 데이터 수정 PR이 머지되면
      # 반드시 제거할 것 (제거 전까지는 이 실패가 매 실행 로그에 계속 남아 추적됨).
      - name: Run CSV validation
        continue-on-error: true
        run: python3 tools/validate_csv.py

  build-android:
    name: Build Android APK
    needs: validate-balance-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library 폴더 캐시: Unity의 에셋 재-임포트는 매번 하면 매우 느리므로
      # Assets/Packages/ProjectSettings 해시가 바뀌지 않으면 이전 Library를 재사용한다.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # zombies.csv / rounds.csv -> Assets/Resources, Assets/StreamingAssets 동기화는
      # CsvResourceSync.cs(IPreprocessBuildWithReport)가 빌드 직전에 자동으로 수행하므로
      # 여기서 별도 스텝은 필요 없음.

      # 프로젝트에 이미 있는 Assets/Scripts/Editor/BuildScript.cs::BuildAndroid()를
      # 그대로 호출한다 (로컬 배치 빌드와 CI 빌드가 동일한 코드 경로를 타도록 유지).
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.2.6f2
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}

      # BuildScript.BuildAndroid()는 Builds/Android/WhocaresMercenaryCorps_<version>.apk 로 출력한다.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Builds/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # 기본 GITHUB_TOKEN은 저장소 설정에 따라 읽기 전용일 수 있음.
    # softprops/action-gh-release가 릴리스를 생성하려면 contents: write 권한이 필요해서
    # 이 잡에만 최소 권한으로 명시 (workflow 전체에 쓰기 권한을 주지 않기 위함).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      # main에 push될 때마다 커밋 SHA 기반 태그로 릴리스를 만들어 APK를 첨부한다.
      # README에 안내된 "Releases 탭에서 APK 다운로드" 배포 방식과 연결된다.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Android Build #${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
